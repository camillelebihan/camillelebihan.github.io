<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="portfoliocam.css">
    <title>Portfolio Camille</title>
</head>
<body>
    <header class="cleanhead">
  <div class="cleanhead-wrap">
    <div class="cleanhead-logo">CAMILLE LE BIHAN</div>
    <nav class="cleanhead-nav">
      <a href="#projects">WORK</a>
      <a href="#about">ABOUT</a>
      <a href="#contact">CONTACT</a>
      <span id="clock" class="cleanhead-clock">FR&nbsp;&nbsp;--:--</span>
    </nav>
  </div>
</header>
    <h1>This is Camilles Portfolio</h1>
    <script>
  function updateClock(){
    const now = new Date();
    const paris = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Europe/Paris', hour: '2-digit', minute: '2-digit', hour12: false
    }).format(now);
    document.getElementById('clock').textContent = 'FR  ' + paris;
  }
  updateClock();
  setInterval(updateClock, 1000 * 30);
</script>
</body>
</html>
